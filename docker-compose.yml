services:

    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: financial-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        depends_on:
            - mysql

    nginx:
        image: nginx:latest
        container_name: financial-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    mysql:
        image: mysql:9.7
        container_name: financial-mysql
        restart: unless-stopped
        ports:
            - "3307:3306" # Alterado para 3307 na máquina host
        environment:
            MYSQL_DATABASE: financial
            MYSQL_USER: financial
            MYSQL_PASSWORD: 123456
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            timeout: 20s
            retries: 10

volumes:
    mysql_data:
